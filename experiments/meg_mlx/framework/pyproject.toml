[build-system]
requires = ["setuptools>=75,<82", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "meg-mlx-bridge"
version = "0.1.0"
description = "An MLX-native experimental interface for MeG-style Phi-2 neuron editing (not a port of upstream MeG)"
requires-python = ">=3.11"
dependencies = ["mlx>=0.32.3,<0.34"]

[project.optional-dependencies]
phi2 = ["mlx-lm==0.31.3"]
build = ["build==1.3.0"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["meg_mlx_bridge*"]
