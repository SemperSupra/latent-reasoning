name: clrs-bfs-preflight

on:
  pull_request:
    paths:
      - "tools/clrs_bfs_preflight.py"
      - ".github/workflows/clrs-bfs-preflight.yml"
      - "docs/clrs-bfs-preflight.md"

permissions:
  contents: read

jobs:
  pinned-bfs:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Clone exact CLRS source
        run: |
          git clone --filter=blob:none https://github.com/google-deepmind/clrs.git /tmp/clrs
          git -C /tmp/clrs checkout f8f25086f33e0b4c128583167151fc53b293c5f5
          test "$(git -C /tmp/clrs rev-parse HEAD)" = "f8f25086f33e0b4c128583167151fc53b293c5f5"
      - name: Verify Apache-2.0 license
        run: |
          grep -q "Apache License" /tmp/clrs/LICENSE
          grep -q "Version 2.0" /tmp/clrs/LICENSE
      - name: Install exact pinned CLRS package
        run: python -m pip install /tmp/clrs
      - name: Run BFS sampler and hint preflight
        run: python tools/clrs_bfs_preflight.py > /tmp/clrs-bfs-preflight.json
      - name: Validate receipt
        run: |
          python - <<'PY'
          import json
          p=json.load(open("/tmp/clrs-bfs-preflight.json"))
          assert p["evidence_class"] == "pinned-upstream-benchmark-generator-preflight"
          assert p["algorithm"] == "bfs"
          assert p["independent_final_parent_mismatches"] == 0
          assert {"reach_h", "pi_h"} <= set(p["hint_names"])
          assert len(p["samples"]) == 4
          print(json.dumps(p, indent=2, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: clrs-bfs-preflight
          path: /tmp/clrs-bfs-preflight.json
          retention-days: 14
