name: causal-slot-method-smoke

on:
  pull_request:
    paths:
      - "experiments/causal_slot_smoke.py"
      - "tests/test_causal_slot_smoke.py"
      - "replays/causal-slot-smoke.json"
      - ".github/workflows/causal-slot-method-smoke.yml"
      - "tools/run_replay.py"
      - "experiments/register_state_representation_comparison.py"
      - "experiments/register_state_saturation.py"

permissions:
  contents: read

jobs:
  causal-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install existing CPU environment
        run: python -m pip install -r requirements-experiment-cpu.txt
      - name: Validate intervention contracts
        run: python -m unittest tests/test_causal_slot_smoke.py -v
      - name: Execute bounded runner-neutral causal smoke
        run: |
          python tools/run_replay.py \
            replays/causal-slot-smoke.json \
            --output /tmp/causal-scientific-receipt.json \
            --metadata /tmp/causal-replay-metadata.json
      - name: Verify receipt gates and provenance
        run: |
          python - <<'PY'
          import json,os
          r=json.load(open("/tmp/causal-scientific-receipt.json"))
          m=json.load(open("/tmp/causal-replay-metadata.json"))
          assert r["evidence_class"]=="causal-slot-method-smoke"
          assert r["family"]=="register-state-mini-v1"
          assert r["resource_class"]=="cpu"
          assert r["settings"]["recurrent_steps"]==1
          assert len(r["records"])==1
          assert m["replay_spec_id"]=="campaign-0001/wp7a-causal-slot-method-smoke"
          assert m["git_head"]==os.environ["GITHUB_SHA"]
          assert m["scientific_receipt_sha256"]
          for row in r["records"]:
              assert row["latent_fit"]["encoder_passes_per_input"]==2
              assert row["serial_fit"]["encoder_passes_per_input"]==2
              assert row["interventions"]["clone-noop"]["prediction_flip_rate"]==0.0
              assert row["interventions"]["untouched"]["prediction_flip_rate"]==0.0
          print(json.dumps({
              "source_sha":m["git_head"],
              "scientific_receipt_sha256":m["scientific_receipt_sha256"],
              "paired_id_gate":r["all_paired_id_gates_passed"],
              "evidence_class":r["evidence_class"],
          },sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: causal-slot-method-smoke
          path: |
            /tmp/causal-scientific-receipt.json
            /tmp/causal-replay-metadata.json
          retention-days: 14
