name: meg-mlx-macos-surrogate

on:
  pull_request:
    paths:
      - "experiments/meg_mlx/**"
      - "docs/rdte/meg-mlx-macos-surrogate.md"
      - ".github/workflows/meg-mlx-macos-surrogate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Syntax contract, no accelerator required
        run: python3 -m py_compile experiments/meg_mlx/surrogate_gpu.py
  macos-mlx-smoke:
    needs: source-contract
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        runner: [macos-26, xcode-27]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          architecture: arm64
      - name: Install pinned public MLX and CPU oracle dependency
        run: |
          python -m pip install --disable-pip-version-check "mlx==0.32.4" "numpy==2.1.1"
      - name: Execute bounded MLX GPU intervention oracle
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/meg-mlx"
          python experiments/meg_mlx/surrogate_gpu.py | tee "$RUNNER_TEMP/meg-mlx/result.json"
          python - "$RUNNER_TEMP/meg-mlx/result.json" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1], encoding="utf-8"))
          assert data["status"] == "PASS"
          assert data["claim"] == "tiny_synthetic_gpu_intervention_only"
          assert data["zero_intervention_exact"]
          assert data["gradient_finite_nonzero"]
          assert not data["meg_paper_reproduced"]
          PY
      - name: Publish bounded public-safe method receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: meg-mlx-surrogate-${{ matrix.runner }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/meg-mlx/result.json
          retention-days: 7
          if-no-files-found: warn
