name: coconut-core-cpu-preflight

on:
  pull_request:
    paths:
      - "tools/coconut_core_cpu_preflight.py"
      - "requirements-coconut-preflight.txt"
      - ".github/workflows/coconut-core-cpu-preflight.yml"

permissions:
  contents: read

jobs:
  pinned-upstream-core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU PyTorch
        run: python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements-coconut-preflight.txt
      - name: Clone exact upstream revision
        run: |
          git clone --filter=blob:none https://github.com/facebookresearch/coconut.git /tmp/coconut
          git -C /tmp/coconut checkout 27273cb8cca4bb763c041a63b036d0c3b7cbbb48
          test "$(git -C /tmp/coconut rev-parse HEAD)" = "27273cb8cca4bb763c041a63b036d0c3b7cbbb48"
      - name: Execute upstream core preflight
        env:
          COCONUT_UPSTREAM: /tmp/coconut
        run: python tools/coconut_core_cpu_preflight.py > /tmp/coconut-preflight.json
      - name: Validate receipt
        run: |
          python - <<'PY'
          import json
          p=json.load(open("/tmp/coconut-preflight.json"))
          assert p["evidence_class"] == "pinned-upstream-core-preflight"
          assert p["gradient_through_recurrence"] is True
          assert all(p["latent_slots_replaced"])
          assert p["trainer_gpu_bound_as_written"] is True
          print(json.dumps(p, indent=2, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: coconut-core-cpu-preflight
          path: /tmp/coconut-preflight.json
          retention-days: 14
