name: coconut-stage0-plan-preflight

on:
  pull_request:
    paths:
      - "plans/coconut-gsm-cot-stage0-2gpu.json"
      - "configs/coconut-gsm-cot-stage0-2gpu.yaml"
      - "profiles/coconut-gsm-cot-stage0-2gpu.json"
      - "tools/validate_coconut_stage0_plan.py"
      - "tests/test_coconut_stage0_plan.py"
      - ".github/workflows/coconut-stage0-plan-preflight.yml"
      - "docs/coconut-stage0-plan.md"

permissions:
  contents: read

jobs:
  plan-and-refuse-placement:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install PyYAML==6.0.3
      - run: python -m unittest tests/test_coconut_stage0_plan.py -v
      - name: Clone exact Coconut reference
        run: |
          git clone --filter=blob:none https://github.com/facebookresearch/coconut.git /tmp/coconut
          git -C /tmp/coconut checkout 27273cb8cca4bb763c041a63b036d0c3b7cbbb48
      - name: Validate reference adaptation and launch argv
        run: |
          python tools/validate_coconut_stage0_plan.py \
            --upstream-root /tmp/coconut \
            --plan plans/coconut-gsm-cot-stage0-2gpu.json \
            --derived-config configs/coconut-gsm-cot-stage0-2gpu.yaml \
            --output /tmp/stage0-plan.json
          python - <<'PY'
          import json
          p=json.load(open("/tmp/stage0-plan.json"))
          assert p["evidence_class"]=="coconut-stage0-launch-plan"
          assert p["reference_effective_global_batch"]==128
          assert p["target_effective_global_batch"]==128
          assert p["launcher_argv"][0]=="torchrun"
          assert p["launcher_argv"][1]=="--nproc_per_node=2"
          assert p["launcher_uses_shell"] is False
          assert p["environment"]["WANDB_MODE"]=="offline"
          print(json.dumps(p,indent=2,sort_keys=True))
          PY
      - name: Prove GHA is not an eligible stage-0 training substrate
        run: |
          python tools/observe_substrate.py > /tmp/substrate.json
          python tools/check_substrate_compatibility.py \
            /tmp/substrate.json \
            profiles/coconut-gsm-cot-stage0-2gpu.json \
            --output /tmp/compatibility.json
          python - <<'PY'
          import json
          p=json.load(open("/tmp/compatibility.json"))
          assert p["compatible"] is False
          assert p["decision"]=="do-not-apply"
          assert "nvidia_device_visibility_unavailable" in p["blocking_reasons"]
          assert "gpu_count_below_minimum" in p["blocking_reasons"]
          print(json.dumps(p,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: coconut-stage0-plan
          path: |
            /tmp/stage0-plan.json
            /tmp/substrate.json
            /tmp/compatibility.json
          retention-days: 14
