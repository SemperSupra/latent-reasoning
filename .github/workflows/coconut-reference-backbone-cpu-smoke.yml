name: coconut-reference-backbone-cpu-smoke

on:
  pull_request:
    paths:
      - "tools/coconut_reference_backbone_smoke.py"
      - "requirements-coconut-reference-smoke.txt"
      - ".github/workflows/coconut-reference-backbone-cpu-smoke.yml"

permissions:
  contents: read

jobs:
  gpt2-train-step:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU PyTorch
        run: python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements-coconut-reference-smoke.txt
      - name: Clone exact Coconut source
        run: |
          git clone --filter=blob:none https://github.com/facebookresearch/coconut.git /tmp/coconut
          git -C /tmp/coconut checkout 27273cb8cca4bb763c041a63b036d0c3b7cbbb48
          test "$(git -C /tmp/coconut rev-parse HEAD)" = "27273cb8cca4bb763c041a63b036d0c3b7cbbb48"
      - name: Execute reference-backbone train-step smoke
        env:
          COCONUT_UPSTREAM: /tmp/coconut
        run: python tools/coconut_reference_backbone_smoke.py > /tmp/coconut-gpt2-smoke.json
      - name: Validate receipt
        run: |
          python - <<'PY'
          import json
          p=json.load(open("/tmp/coconut-gpt2-smoke.json"))
          assert p["evidence_class"] == "pinned-upstream-reference-backbone-training-smoke"
          assert p["backbone"] == "openai-community/gpt2"
          assert p["gradient_through_recurrence"] is True
          assert p["optimizer_step_changed_parameter"] is True
          print(json.dumps(p, indent=2, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: coconut-reference-backbone-cpu-smoke
          path: /tmp/coconut-gpt2-smoke.json
          retention-days: 14
