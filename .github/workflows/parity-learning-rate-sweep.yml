name: parity-learning-rate-sweep

on:
  pull_request:
    paths:
      - "experiments/parity_saturation.py"
      - "experiments/parity_lr_sweep.py"
      - "tests/test_parity_lr_sweep.py"
      - ".github/workflows/parity-learning-rate-sweep.yml"
  push:
    branches:
      - main
    paths:
      - "experiments/parity_saturation.py"
      - "experiments/parity_lr_sweep.py"
      - "tests/test_parity_lr_sweep.py"
      - ".github/workflows/parity-learning-rate-sweep.yml"

permissions:
  contents: read

jobs:
  id-only-sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU PyTorch
        run: python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m unittest tests/test_parity_saturation.py tests/test_parity_lr_sweep.py -v
      - name: Run learning-rate-only sweep
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            RATES="0.001,0.003,0.01"
            SEEDS="0,1,2"
            STAGES="2,4,8"
            MAX_EPOCHS="1000"
          else
            RATES="0.001,0.003"
            SEEDS="0"
            STAGES="2,4"
            MAX_EPOCHS="80"
          fi
          python -m experiments.parity_lr_sweep \
            --learning-rates "$RATES" \
            --seeds "$SEEDS" \
            --stages "$STAGES" \
            --max-epochs-per-stage "$MAX_EPOCHS" \
            > /tmp/parity-lr-sweep.json
      - name: Enforce no-OOD tuning boundary
        run: |
          python - <<'PY'
          import json
          p=json.load(open("/tmp/parity-lr-sweep.json"))
          assert p["evidence_class"] == "benchmark-regime-id-training-dynamics-sweep"
          assert p["controlled_variable"] == "learning_rate"
          assert p["ood_evaluation_enabled"] is False
          for candidate in p["candidates"]:
              for seed in candidate["seeds"]:
                  assert seed["ood_emitted"] is False
          print(json.dumps({
              "candidates":p["candidates"],
              "selected_learning_rate":p["selected_learning_rate"],
              "decision":p["decision"],
          },indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: parity-learning-rate-sweep
          path: /tmp/parity-lr-sweep.json
          retention-days: 14
