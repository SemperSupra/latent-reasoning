name: prontoqa-generator-preflight

on:
  pull_request:
    paths:
      - ".github/workflows/prontoqa-generator-preflight.yml"
      - "docs/prontoqa-generator-preflight.md"

permissions:
  contents: read

jobs:
  pinned-generator:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Clone exact PrOntoQA source
        run: |
          git clone --filter=blob:none https://github.com/asaparov/prontoqa.git /tmp/prontoqa
          git -C /tmp/prontoqa checkout 0a6412b6fddf46324a1cb96e066dd7b3d89b87d6
          test "$(git -C /tmp/prontoqa rev-parse HEAD)" = "0a6412b6fddf46324a1cb96e066dd7b3d89b87d6"
      - name: Verify upstream license
        run: |
          grep -q "Apache License" /tmp/prontoqa/LICENSE
          grep -q "Version 2.0" /tmp/prontoqa/LICENSE
      - name: Install generator dependencies only
        run: python -m pip install numpy==2.1.3 scipy==1.14.1
      - name: Generate pinned upstream JSON examples
        working-directory: /tmp/prontoqa
        run: |
          python run_experiment.py             --model-name json             --model-size none             --num-trials 4             --few-shot-examples 0             --min-hops 1             --max-hops 2             --hops-skip 1             --ontology fictional             --distractors none             --test-distractors none             --seed 20260922
      - name: Validate generated data
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root=Path("/tmp/prontoqa")
          generated=sorted(root.glob("*hop*.json"))
          assert len(generated) == 2, [p.name for p in generated]

          summary={}
          for path in generated:
              name=path.name
              hop=None
              for candidate in (1,2):
                  if f"{candidate}hop" in name:
                      hop=candidate
                      break
              assert hop is not None, name
              data=json.loads(path.read_text())
              assert isinstance(data, dict)
              assert len(data) == 4
              assert all(isinstance(item, dict) for item in data.values())
              assert set(data) == {"example1", "example2", "example3", "example4"}
              first=next(iter(data.values()))
              summary[str(hop)]={
                  "file": name,
                  "count": len(data),
                  "keys": sorted(first.keys()),
                  "bytes": path.stat().st_size,
              }
          assert set(summary) == {"1", "2"}

          receipt={
              "schema_version": 1,
              "evidence_class": "pinned-upstream-benchmark-generator-preflight",
              "source": {
                  "repository": "asaparov/prontoqa",
                  "revision": "0a6412b6fddf46324a1cb96e066dd7b3d89b87d6",
                  "license": "Apache-2.0",
              },
              "generator_mode": "json",
              "hops": summary,
              "claim_boundary": (
                  "This proves deterministic execution of the pinned upstream "
                  "PrOntoQA generator surface only. It does not validate model "
                  "evaluation or admit generated examples as qualification holdouts."
              ),
          }
          Path("/tmp/prontoqa-generator-receipt.json").write_text(
              json.dumps(receipt, sort_keys=True)
          )
          print(json.dumps(receipt, indent=2, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: prontoqa-generator-preflight
          path: |
            /tmp/prontoqa-generator-receipt.json
            /tmp/prontoqa/*hop*.json
          retention-days: 14
