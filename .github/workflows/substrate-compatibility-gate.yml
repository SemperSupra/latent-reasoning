name: substrate-compatibility-gate

on:
  pull_request:
    paths:
      - "schemas/substrate-requirements.schema.json"
      - "profiles/coconut-reference-gpu-smoke.json"
      - "tools/check_substrate_compatibility.py"
      - "tests/test_substrate_compatibility.py"
      - ".github/workflows/substrate-compatibility-gate.yml"
      - "docs/substrate-compatibility.md"

permissions:
  contents: read

jobs:
  fail-closed-fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest tests/test_substrate_compatibility.py -v
      - name: Observe public GHA host
        run: python tools/observe_substrate.py > /tmp/substrate.json
      - name: Evaluate Coconut GPU-smoke placement
        run: |
          python tools/check_substrate_compatibility.py             /tmp/substrate.json             profiles/coconut-reference-gpu-smoke.json             --output /tmp/compatibility.json
      - name: Verify GHA correctly fails closed for GPU workload
        run: |
          python - <<'PY'
          import json
          p=json.load(open("/tmp/compatibility.json"))
          assert p["compatible"] is False
          assert p["decision"]=="do-not-apply"
          assert "nvidia_device_visibility_unavailable" in p["blocking_reasons"]
          assert "nvidia_container_runtime_not_declared" in p["blocking_reasons"]
          print(json.dumps(p,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: gpu-smoke-placement-fixture
          path: |
            /tmp/substrate.json
            /tmp/compatibility.json
          retention-days: 14
