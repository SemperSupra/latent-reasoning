name: cpu-mechanism-smoke

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  procedural:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest tests/test_procedural_fsm.py -v
      - run: |
          python tools/generate_fsm_tasks.py \
            --seed 1000 \
            --count 4 \
            --states 7 \
            --steps 8 \
            --output /tmp/fsm-smoke.jsonl
          test "$(wc -l < /tmp/fsm-smoke.jsonl)" -eq 4

  latent-mechanics:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU PyTorch
        run: python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements-cpu-smoke.txt
      - run: python -m unittest tests/test_latent_mechanics.py -v
      - name: Emit bounded mechanism receipt
        working-directory: tests
        run: python ../tools/tiny_mechanic_probe.py > /tmp/tiny-mechanic-receipt.json
      - uses: actions/upload-artifact@v4
        with:
          name: tiny-mechanic-receipt
          path: /tmp/tiny-mechanic-receipt.json
          retention-days: 7
