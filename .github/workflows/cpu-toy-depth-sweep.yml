name: cpu-toy-depth-sweep

on:
  pull_request:
    paths:
      - "experiments/toy_depth_sweep.py"
      - "tests/test_toy_depth_sweep.py"
      - ".github/workflows/cpu-toy-depth-sweep.yml"
  push:
    branches:
      - main
    paths:
      - "experiments/toy_depth_sweep.py"
      - "tests/test_toy_depth_sweep.py"
      - ".github/workflows/cpu-toy-depth-sweep.yml"

permissions:
  contents: read

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU PyTorch
        run: python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m unittest tests/test_toy_depth_sweep.py -v
      - name: Run controlled depth sweep
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            LAYERS="1,2,4"
            SEEDS="0,1,2,3,4"
            EPOCHS="40"
          else
            LAYERS="1,2"
            SEEDS="0,1"
            EPOCHS="12"
          fi
          python -m experiments.toy_depth_sweep \
            --layers "$LAYERS" \
            --seeds "$SEEDS" \
            --epochs "$EPOCHS" \
            --train-count 768 \
            --eval-count 192 \
            > /tmp/depth-sweep.json
      - name: Validate receipt
        run: |
          python - <<'PY'
          import json
          p=json.load(open("/tmp/depth-sweep.json"))
          assert p["evidence_class"] == "toy-baseline-learnability"
          assert p["controlled_variable"] == "transformer_layers"
          assert p["decision"] in {
              "freeze-smallest-qualified-depth",
              "depth-alone-did-not-establish-learnability",
          }
          print(json.dumps({
              "aggregate": p["aggregate"],
              "qualified_layers": p["qualified_layers"],
              "decision": p["decision"],
          }, indent=2, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: toy-depth-sweep-receipt
          path: /tmp/depth-sweep.json
          retention-days: 14
