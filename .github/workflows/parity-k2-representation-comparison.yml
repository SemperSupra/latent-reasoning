name: parity-k2-representation-comparison

on:
  pull_request:
    paths:
      - "experiments/parity_representation_comparison.py"
      - "tests/test_parity_representation_comparison.py"
      - ".github/workflows/parity-k2-representation-comparison.yml"
      - "docs/parity-k2-representation-comparison.md"
  push:
    branches:
      - main
    paths:
      - "experiments/parity_representation_comparison.py"
      - "tests/test_parity_representation_comparison.py"
      - ".github/workflows/parity-k2-representation-comparison.yml"
      - "docs/parity-k2-representation-comparison.md"

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU PyTorch
        run: python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m unittest tests/test_parity_representation_comparison.py -v
      - name: Run fixed-K comparison
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            SEEDS="0,1,2"
            STAGES="2,4,8"
            MAX_EPOCHS="1000"
            OOD_MIN="9"
            OOD_MAX="16"
            OOD_PER_LENGTH="256"
            K="2"
          else
            SEEDS="0"
            STAGES="2,4"
            MAX_EPOCHS="200"
            OOD_MIN="5"
            OOD_MAX="6"
            OOD_PER_LENGTH="64"
            K="1"
          fi

          python -m experiments.parity_representation_comparison             --seeds "$SEEDS"             --stages "$STAGES"             --recurrent-steps "$K"             --max-epochs-per-stage "$MAX_EPOCHS"             --learning-rate 0.001             --ood-min-length "$OOD_MIN"             --ood-max-length "$OOD_MAX"             --ood-per-length "$OOD_PER_LENGTH"             > /tmp/parity-comparison.json
      - name: Validate comparison receipt
        run: |
          python - <<'PY'
          import json
          p=json.load(open("/tmp/parity-comparison.json"))
          assert p["evidence_class"] == "fixed-k-reasoning-representation-comparison"
          assert p["settings"]["learning_rate"] == 0.001
          assert p["aggregate"]["serial-control"]["forward_calls_per_batch"] == p["aggregate"]["latent"]["forward_calls_per_batch"]
          if "${{ github.event_name }}" == "push":
              assert p["settings"]["recurrent_steps"] == 2
          print(json.dumps({
              "aggregate": p["aggregate"],
              "paired_analysis": p["paired_analysis"],
              "comparison_valid": p["comparison_valid"],
          }, indent=2, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: parity-k2-representation-comparison
          path: /tmp/parity-comparison.json
          retention-days: 14
