name: cpu-toy-learning

on:
  pull_request:
    paths:
      - "experiments/toy_modular_walk.py"
      - "tests/test_toy_modular_walk.py"
      - ".github/workflows/cpu-toy-learning.yml"
  push:
    branches:
      - main
    paths:
      - "experiments/toy_modular_walk.py"
      - "tests/test_toy_modular_walk.py"
      - ".github/workflows/cpu-toy-learning.yml"
  workflow_dispatch:
    inputs:
      epochs:
        description: "Training epochs per treatment/seed"
        required: false
        default: "40"
      seeds:
        description: "Comma-separated seeds"
        required: false
        default: "0,1,2,3,4"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU PyTorch
        run: python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m unittest tests/test_toy_modular_walk.py -v
      - name: Run bounded learning experiment
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            EPOCHS="40"
            SEEDS="0,1,2,3,4"
            REPORT_EPOCHS="1,2,4,8,16,24,32,40"
          else
            EPOCHS="${{ github.event.inputs.epochs || '4' }}"
            SEEDS="${{ github.event.inputs.seeds || '0,1' }}"
            REPORT_EPOCHS="1,2,4"
          fi
          python experiments/toy_modular_walk.py \
            --epochs "$EPOCHS" \
            --report-epochs "$REPORT_EPOCHS" \
            --seeds "$SEEDS" \
            --train-count 768 \
            --eval-count 192 \
            --batch-size 128 \
            --latent-steps 2 \
            > /tmp/toy-learning.json
      - name: Sanity-check receipt
        run: |
          python - <<'PY'
          import json
          p = json.load(open("/tmp/toy-learning.json"))
          assert p["schema_version"] == 2
          assert p["evidence_class"] == "toy-system-learning"
          assert set(p["aggregate"]) == {"direct", "serial-control", "latent"}
          assert p["aggregate"]["serial-control"]["forward_calls"] == p["aggregate"]["latent"]["forward_calls"]
          assert "paired_analysis" in p
          assert p["learnability_status"] in {"underfit", "partially-learned", "well-learned"}
          print(json.dumps({
              "aggregate": p["aggregate"],
              "paired_analysis": p["paired_analysis"],
              "learnability_status": p["learnability_status"],
          }, indent=2, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: cpu-toy-learning-receipt
          path: /tmp/toy-learning.json
          retention-days: 14
