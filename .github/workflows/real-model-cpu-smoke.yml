name: real-model-cpu-smoke

on:
  pull_request:
    paths:
      - "tools/real_model_cpu_smoke.py"
      - "requirements-real-model-smoke.txt"
      - ".github/workflows/real-model-cpu-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qwen-0_5b:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      MODEL_ID: Qwen/Qwen2.5-0.5B-Instruct
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU PyTorch
        run: python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements-real-model-smoke.txt
      - name: Run pretrained-model recurrence smoke
        run: python tools/real_model_cpu_smoke.py > /tmp/real-model-smoke.json
      - name: Validate evidence boundary
        run: |
          python - <<'PY'
          import json
          p=json.load(open("/tmp/real-model-smoke.json"))
          assert p["evidence_class"] == "representative-pretrained-model-interface-smoke"
          assert p["inputs_embeds_supported"] is True
          assert p["hidden_states_supported"] is True
          for k in (1,2,4):
              s=p["treatments"][f"serial_control_k{k}"]["forward_calls"]
              l=p["treatments"][f"latent_k{k}"]["forward_calls"]
              assert s == l == k + 1
          print(json.dumps({
              "model_id": p["model_id"],
              "parameter_count": p["parameter_count"],
              "prompt_token_count": p["prompt_token_count"],
              "treatments": p["treatments"],
          }, indent=2, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: real-model-cpu-smoke
          path: /tmp/real-model-smoke.json
          retention-days: 14
